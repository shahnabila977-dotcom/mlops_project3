apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-service
  labels:
    app: ml-model-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-model-service
  template:
    metadata:
      labels:
        app: ml-model-service
    spec:
      containers:
        - name: model-server
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=ML Model Inference OK"
          ports:
            - containerPort: 5678
